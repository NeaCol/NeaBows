# ==============================================================================
# NeaBows - Core Engine Configuration
# Projectile Physics, Particle Density & Cooldown Thresholds
# ==============================================================================

settings:
  # Enable projectile trajectory particle tracing
  trail-particles: true
  # Particle spawn interval in server ticks (2 = dense, 4 = balanced, 6 = lightweight)
  trail-interval: 2
  # Whether bow elemental effects affect other players
  affect-players: true
  # Whether self-inflicted hits apply elemental effects
  affect-self: false

# ------------------------------------------------------------------------------
# Cooldown Specification (Seconds)
# Protects server tick rate from projectile spam exploits.
# 0 = No cooldown applied. Cooldown triggers upon projectile launch.
# ------------------------------------------------------------------------------
cooldowns:
  # Global fallback cooldown
  global: 3
  # Specific elemental power overrides
  per-power:
    fuego: 3
    hielo: 4
    muertos: 5
    viento: 3
    escorpion: 4
    hueso: 3
    tierra: 3

# ------------------------------------------------------------------------------
# Sound FX Bindings (Bukkit org.bukkit.Sound enum references)
# ------------------------------------------------------------------------------
sounds:
  fuego:
    shoot: ENTITY_BLAZE_SHOOT
    hit: ENTITY_BLAZE_HURT
  hielo:
    shoot: BLOCK_POWDER_SNOW_STEP
    hit: ENTITY_PLAYER_HURT_FREEZE
  muertos:
    shoot: ENTITY_WITHER_SHOOT
    hit: ENTITY_WITHER_HURT
  viento:
    shoot: ENTITY_PHANTOM_FLAP
    hit: ENTITY_PHANTOM_HURT
  escorpion:
    shoot: ENTITY_SPIDER_AMBIENT
    hit: ENTITY_SPIDER_HURT
  hueso:
    shoot: ENTITY_SKELETON_SHOOT
    hit: ENTITY_SKELETON_HURT
  tierra:
    shoot: BLOCK_GRAVEL_BREAK
    hit: BLOCK_GRAVEL_PLACE
