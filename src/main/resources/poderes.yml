# ================================================================
#   NeaBows - Configuración de Poderes
#   Aquí puedes personalizar cada poder, sus niveles y efectos.
#
#   Efectos disponibles (nombre para el campo 'efecto'):
#     SLOWNESS, MINING_FATIGUE, WITHER, POISON, BLINDNESS,
#     DARKNESS, LEVITATION, WEAKNESS, NAUSEA, HUNGER, ABSORPTION
#
#   Duraciones en TICKS (20 ticks = 1 segundo)
# ================================================================

poderes:
  # ── FUEGO ──────────────────────────────────────────────────────
  fuego:
    nombre: "Fuego"
    habilitado: true
    color: "#FF6B35"
    color-secundario: "#FF0000"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Prende fuego al objetivo por 3 segundos"
        duracion-fuego: 60 # 3 segundos de fuego
      2:
        descripcion: "Prende fuego al objetivo por 6 segundos"
        duracion-fuego: 120 # 6 segundos de fuego
      3:
        descripcion: "Infierno: fuego devastador por 10 segundos"
        duracion-fuego: 200 # 10 segundos de fuego

  # ── HIELO ──────────────────────────────────────────────────────
  hielo:
    nombre: "Hielo"
    habilitado: true
    color: "#7DD8E8"
    color-secundario: "#FFFFFF"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Lentitud I al objetivo por 4 segundos"
        efecto: SLOWNESS
        amplificador: 0
        duracion-efecto: 80
      2:
        descripcion: "Lentitud II y congela al objetivo"
        efecto: SLOWNESS
        amplificador: 1
        duracion-efecto: 120
        freeze-ticks: 100
      3:
        descripcion: "Glacial: congela y ciega por completo"
        efecto: SLOWNESS
        amplificador: 2
        duracion-efecto: 160
        freeze-ticks: 200
        efecto2: BLINDNESS
        amplificador2: 0
        duracion-efecto2: 60

  # ── MUERTOS ────────────────────────────────────────────────────
  muertos:
    nombre: "Muertos"
    habilitado: true
    color: "#8B8B8B"
    color-secundario: "#333333"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Marchitamiento I al objetivo"
        efecto: WITHER
        amplificador: 0
        duracion-efecto: 100
      2:
        descripcion: "Marchitamiento II prolongado"
        efecto: WITHER
        amplificador: 1
        duracion-efecto: 140
      3:
        descripcion: "Oscuridad total: marchitamiento supremo"
        efecto: WITHER
        amplificador: 2
        duracion-efecto: 180
        efecto2: DARKNESS
        amplificador2: 0
        duracion-efecto2: 80

  # ── VIENTO ─────────────────────────────────────────────────────
  viento:
    nombre: "Viento"
    habilitado: true
    color: "#C0E8FF"
    color-secundario: "#87CEEB"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Lanza al objetivo por los aires"
        velocidad-y: 1.2
      2:
        descripcion: "Ráfaga: lanza muy alto al objetivo"
        velocidad-y: 1.8
        efecto: LEVITATION
        amplificador: 0
        duracion-efecto: 30
      3:
        descripcion: "Torbellino: velocidad máxima hacia el cielo"
        velocidad-y: 2.5
        efecto: LEVITATION
        amplificador: 1
        duracion-efecto: 60

  # ── ESCORPIÓN ──────────────────────────────────────────────────
  escorpion:
    nombre: "Escorpión"
    habilitado: true
    color: "#32CD32"
    color-secundario: "#006400"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Veneno I al objetivo"
        efecto: POISON
        amplificador: 0
        duracion-efecto: 100
      2:
        descripcion: "Veneno II prolongado"
        efecto: POISON
        amplificador: 1
        duracion-efecto: 140
      3:
        descripcion: "Veneno letal del escorpión"
        efecto: POISON
        amplificador: 2
        duracion-efecto: 180
        efecto2: WEAKNESS
        amplificador2: 0
        duracion-efecto2: 100

  # ── AMATISTA ───────────────────────────────────────────────────
  amatista:
    nombre: "Amatista"
    habilitado: true
    color: "#9966CC"
    color-secundario: "#4B0082"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Disparo triple (consume 3 flechas)"
      2:
        descripcion: "Disparo triple + Debilidad I"
        efecto: WEAKNESS
        amplificador: 0
        duracion-efecto: 60
      3:
        descripcion: "Disparo triple + Debilidad II y Ceguera"
        efecto: WEAKNESS
        amplificador: 1
        duracion-efecto: 100
        efecto2: BLINDNESS
        amplificador2: 0
        duracion-efecto2: 40

  # ── HUESO ──────────────────────────────────────────────────────
  hueso:
    nombre: "Hueso"
    habilitado: true
    color: "#F5F5DC"
    color-secundario: "#D2B48C"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Fatiga minera al objetivo"
        efecto: MINING_FATIGUE
        amplificador: 0
        duracion-efecto: 100
      2:
        descripcion: "Fatiga minera + lentitud al objetivo"
        efecto: MINING_FATIGUE
        amplificador: 1
        duracion-efecto: 120
        efecto2: SLOWNESS
        amplificador2: 0
        duracion-efecto2: 80
      3:
        descripcion: "Cuerpo quebrado: fatiga y lentitud máximas"
        efecto: MINING_FATIGUE
        amplificador: 2
        duracion-efecto: 160
        efecto2: SLOWNESS
        amplificador2: 1
        duracion-efecto2: 120

  # ── TIERRA ─────────────────────────────────────────────────────
  tierra:
    nombre: "Tierra"
    habilitado: true
    color: "#A0522D"
    color-secundario: "#8B4513"
    max-nivel: 3
    niveles:
      1:
        descripcion: "Ceguera al objetivo por 3 segundos"
        efecto: BLINDNESS
        amplificador: 0
        duracion-efecto: 60
      2:
        descripcion: "Ceguera y lentitud devastadoras"
        efecto: BLINDNESS
        amplificador: 0
        duracion-efecto: 100
        efecto2: SLOWNESS
        amplificador2: 0
        duracion-efecto2: 80
      3:
        descripcion: "La tierra aplasta: náusea total"
        efecto: BLINDNESS
        amplificador: 0
        duracion-efecto: 140
        efecto2: SLOWNESS
        amplificador2: 1
        duracion-efecto2: 120
        efecto3: NAUSEA
        amplificador3: 0
        duracion-efecto3: 80
